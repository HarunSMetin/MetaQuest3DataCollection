[project]
name = "questcollect"
version = "0.1.0"
description = "Meta Quest 3 teleoperation + data collection for bimanual Franka in MuJoCo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2",
    "mink>=0.0.5",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "h5py>=3.10",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pillow>=10.0",
    "daqp>=0.5",
    "fast-simplification>=0.2.0",
]

[project.optional-dependencies]
# Policy learning (questcollect/learn/): LeRobot export, training, evaluation, live policy. Brings torch.
learn = ["lerobot"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
qc = "questcollect.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["questcollect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# lerobot -> pynput -> evdev needs a C compiler; only lerobot's keyboard teleop uses it, never dataset export.
override-dependencies = ["evdev; sys_platform == 'never'"]
